spring:
  application:
    name: flash-booking
  datasource:
    url: jdbc:postgresql://localhost:5432/flash_booking
    username: flash_booking
    password: flash_booking
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
      connect-timeout: 2s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

flash-booking:
  reservation:
    hold-minutes: 15
    idempotency-ttl-seconds: 86400
    stream-recovery-min-idle-time-ms: 60000
    stream-recovery-interval-ms: 30000
    action-message-max-retries: 5
    expiration-sweep-interval-ms: 5000
    expiration-sweep-batch-size: 200

spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///flash_booking
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s

flash-booking:
  reservation:
    hold-minutes: 15
    idempotency-ttl-seconds: 86400
    stream-recovery-min-idle-time-ms: 60000
    stream-recovery-interval-ms: 30000
    action-message-max-retries: 5
    expiration-sweep-interval-ms: 5000
    expiration-sweep-batch-size: 200

services:
  app:
    build:
      context: .
    container_name: flash-booking-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flash_booking
      SPRING_DATASOURCE_USERNAME: flash_booking
      SPRING_DATASOURCE_PASSWORD: flash_booking
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: flash-booking-postgres
    environment:
      POSTGRES_DB: flash_booking
      POSTGRES_USER: flash_booking
      POSTGRES_PASSWORD: flash_booking
    ports:
      - "5432:5432"
    volumes:
      - flash-booking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash_booking -d flash_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flash-booking-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flash-booking-postgres-data:

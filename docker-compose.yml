services:
  postgres:
    image: postgres:16-alpine
    container_name: flash-booking-postgres
    environment:
      POSTGRES_DB: flash_booking
      POSTGRES_USER: flash_booking
      POSTGRES_PASSWORD: flash_booking
    ports:
      - "5432:5432"
    volumes:
      - flash-booking-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash_booking -d flash_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flash-booking-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flash-booking-postgres-data:
